name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # lets the build store the signing key once

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stable signing key (new builds install over the old app and keep your data)
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "Add app signing key"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not save the signing key. Enable Settings > Actions > General > Workflow permissions > Read and write."
          fi
          mkdir -p "$HOME/.android"
          cp signing/debug.keystore "$HOME/.android/debug.keystore"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare www folder
        run: |
          mkdir -p www
          for f in index.html sw.js manifest.json; do
            if [ -f "$f" ] && [ ! -f "www/$f" ]; then cp "$f" "www/$f"; fi
          done
          test -f www/index.html

      - name: Install dependencies
        run: npm install

      - name: Bundle native bridge
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Install native folder plugin (SD card / any folder)
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR" android/app/src/main/res/xml
          cp native-android/*.java "$DIR/"
          sed -i "s/^package .*;/package $APPID;/" "$DIR"/*.java
          cp native-android/network_security_config.xml android/app/src/main/res/xml/

      - name: Notification icons (vector drawables)
        run: |
          D=android/app/src/main/res/drawable
          mkdir -p "$D"
          vec() { printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n  <path android:pathData="%s" %s/>\n</vector>\n' "$2" "$3" > "$D/$1.xml"; }
          S='android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round"'
          F='android:fillColor="#FFFFFF"'
          vec ic_pb_rewind  "M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10" "$S"
          vec ic_pb_forward "M23 4v6h-6M20.5 15a9 9 0 1 1-2.1-9.4L23 10" "$S"
          vec ic_pb_play    "M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" "$F"
          vec ic_pb_pause   "M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" "$F"
          vec ic_pb_prev    "M6 5h2v14H6zM20 5v14L9 12z" "$F"
          vec ic_pb_next    "M16 5h2v14h-2zM4 5v14l11-7z" "$F"
          vec ic_pb_close   "M18 6L6 18M6 6l12 12" "$S"
          vec ic_pb_stat    "M3 18v-6a9 9 0 0 1 18 0v6M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" "$S"
          ls "$D"

      - name: Android manifest (permissions + local audio streaming)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config"#' "$M"
          APPID=$(node -p "require('./capacitor.config.json').appId")
          sed -i "s#</application>#    <service android:name=\"$APPID.PlaybackService\" android:exported=\"false\" android:foregroundServiceType=\"mediaPlayback\" />\n    </application>#" "$M"
          grep -c "PlaybackService" "$M"
          grep -c "network_security_config" "$M"

      - name: Generate app icons (optional)
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
