name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare www folder
        run: |
          mkdir -p www
          for f in index.html sw.js manifest.json; do
            if [ -f "$f" ] && [ ! -f "www/$f" ]; then cp "$f" "www/$f"; fi
          done
          test -f www/index.html

      - name: Install dependencies
        run: npm install

      - name: Bundle native bridge
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Install native folder plugin (SD card / any folder)
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR" android/app/src/main/res/xml
          cp native-android/*.java "$DIR/"
          sed -i "s/^package .*;/package $APPID;/" "$DIR"/*.java
          cp native-android/network_security_config.xml android/app/src/main/res/xml/

      - name: Android manifest (permissions + local audio streaming)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config"#' "$M"
          grep -c "network_security_config" "$M"

      - name: Generate app icons (optional)
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
