/* lazily extract embedded cover art (ID3 APIC / MP4 covr / cover.jpg) for items that are actually on screen */
function wantThumb(tk,k){
 if(!cfg.covers||!k||!tk||thumbs[tk]||thumbTried.has(tk))return;
 thumbTried.add(tk);thumbQ.push({tk,k});
 if(thumbQ.length>200){const x=thumbQ.shift();thumbTried.delete(x.tk)}
 runThumbs();
}
async function runThumbs(){
 if(thumbBusy)return;thumbBusy=true;
 try{
  while(thumbQ.length){
   const {tk,k}=thumbQ.pop();
   try{
    const f=await getFile(k);
    if(f){
     let img=null;
     if(/\.(m4b|m4a|mp4|aac)$/i.test(f.name)){const bx={};await mp4(f,bx);img=bx.img||null}
     else{const r=await id3(f);if(r)img=r.img}
     if(!img)img=await coverFile(k);
     if(img){const th=await toData(img,160,.78);if(th)await putThumb(tk,th)}
    }
   }catch{}
   await new Promise(r=>setTimeout(r,au.paused?40:300));
  }
 }finally{thumbBusy=false}
}

function show(v){                       // tab switches never pile up: Home -> tab is ONE step back from Home
 const top=navS[navS.length-1];
 if(v==='set'){if(top.t!=='set')navS.push({t:'set',c:[]})}
 else if(v==='home')navS=[navS[0]];
 else if(v==='lib'){if(top.t!=='lib')navS=[navS[0]].concat(libChain(cur))}

}
function go(c){                         // folder navigation: each level is one back step
 const top=navS[navS.length-1];
 if(top.t!=='lib')navS=[navS[0]].concat(libChain(c));
 else{
  while(navS.length>1&&navS[navS.length-1].t==='lib'&&navS[navS.length-1].c.length>c.length)navS.pop();
  const t2=navS[navS.length-1];
  if(!(t2.t==='lib'&&t2.c.length===c.length&&t2.c.every((x,i)=>x===c[i])))navS.push({t:'lib',c:c.slice()});
 }

 const f=await getFile(k);
 if(!f){if(auto)toast(t('notLinked'));return}
 save();sessFlush();key=k;sessOpen(k);queue=q2&&q2.includes(k)?q2:siblings(k);qi=queue.indexOf(k);last=k;SV('ab_last',k);
 const p=prog[k]||[0,0],pos=startAt!=null?startAt:(isDone(p[0],p[1])?0:p[0]);
 pausedAt=(startAt==null&&p[2]&&pos>0)?p[2]:0;
 if(objUrl)URL.revokeObjectURL(objUrl);
 objUrl=f.url||URL.createObjectURL(f);au.volume=1;applyRate(cfg.rates[thumbKey(k)]||cfg.rate);au.src=objUrl;
 au.onloadedmetadata=()=>{prog[k]=[pos,au.duration,Date.now()];au.currentTime=Math.min(pos,Math.max(0,au.duration-1));au.playbackRate=curRate;if(auto)au.play().catch(()=>{});tick()};
 $('#ttl').textContent=nm(k);$('#sub').textContent=folderName(k);$('#mTtl').textContent=nm(k);$('#mSub').textContent=folderName(k);
 setCover(art);loadCh(f,k);renderLib();updateTools();updateMini();
 if(auto&&open&&!playerOpen)openPlayer();
}
function jump(m){if(key===m.k){au.currentTime=m.t;au.play()}else play(m.k,siblings(m.k),m.t,true,false);openPlayer()}
const skip=n=>{au.currentTime=Math.max(0,Math.min(au.duration||0,au.currentTime+n))};
function next(){if(qi<queue.length-1)play(queue[qi+1],queue,undefined,true,false);else popUpNext()}
function stepChapter(d){
 if(!chapters.length)return;
 const c=au.currentTime||0;let ci=-1;chapters.forEach((ch,i)=>{if(ch.t<=c+.3)ci=i});
 let j=d<0?(c-(chapters[Math.max(ci,0)]||{t:0}).t>3?ci:ci-1):ci+1;
 j=Math.max(0,Math.min(chapters.length-1,j));au.currentTime=chapters[j].t;
}

function prev(){if(au.currentTime>3||qi<1)au.currentTime=0;else play(queue[qi-1],queue,undefined,true,false)}
function stepFolder(d){const sibs=siblings(key),i=sibs.indexOf(key),k=sibs[i+d];if(k)play(k,sibs,undefined,true,false)}
/* stop playback, release the audio element and dismiss the OS media notification */
/* ---------- repeat modes, up-next queue, history & stats, lock, shuttle ---------- */
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dur=sec=>{sec=Math.round(sec);if(sec<60)return sec+t('unitS');const h=sec/3600|0,m=Math.floor(sec%3600/60);return h?h+t('unitH')+' '+String(m).padStart(2,'0')+t('unitM'):m+t('unitM')};
const saveH=()=>SV('ab_hist',hist),saveS=()=>SV('ab_stats',stats),saveQ=()=>SV('ab_queue',queueUp);
let sess=null,lastStatT=0;
function sessOpen(k){sess={k,s:Date.now(),w:0,c:0};lastStatT=0}
function statTick(){            // wall-clock based, so it stays accurate when timers are throttled in the background
 if(!sess||au.paused){lastStatT=0;return}
 const n=Date.now();
 if(lastStatT){const d=Math.min(2,(n-lastStatT)/1000);sess.w+=d;sess.c+=d*(au.playbackRate||1)}
 lastStatT=n;
}
function sessFlush(){
 if(noFlush||!sess||sess.w<3)return;
 const x=sess,now=Date.now(),day=ymd(now),d=stats.days[day]||(stats.days[day]=[0,0]);
 d[0]+=x.w;d[1]+=x.c;stats.tw+=x.w;stats.tc+=x.c;
 const L=hist[0];
 if(L&&L.k===x.k&&x.s-L.e<90000){L.w+=Math.round(x.w);L.c+=Math.round(x.c);L.e=now}
 else hist.unshift({k:x.k,s:x.s,e:now,w:Math.round(x.w),c:Math.round(x.c)});
 if(hist.length>600)hist.length=600;
 const ks=Object.keys(stats.days).sort();while(ks.length>400)delete stats.days[ks.shift()];
 x.w=0;x.c=0;x.s=now;saveH();saveS();
}

/* repeat: off -> episode (loop this file) -> book (loop inside this folder) -> all (loop the whole queue) */
function cycleRepeat(){
 const m=['off','episode','book','all'];cfg.repeat=m[(m.indexOf(cfg.repeat)+1)%4];saveCfg();updateModes();
 toast(t({off:'repeatOff',episode:'repeatEp',book:'repeatBook',all:'repeatAll'}[cfg.repeat]));
}
function advance(){
 const mode=cfg.repeat;
 if(mode==='episode'){play(key,queue,0,true,false);return}
 if(mode==='book'){const sib=siblings(key),i=sib.indexOf(key);play(sib[i<sib.length-1?i+1:0],sib,i<sib.length-1?undefined:0,true,false);return}
 if(qi<queue.length-1){play(queue[qi+1],queue,undefined,true,false);return}
 if(popUpNext())return;
 if(mode==='all'&&queue.length)play(queue[0],queue,0,true,false);
}

/* up next queue (books and episodes) */
const qSame=(a,b)=>a.type===b.type&&(a.d||a.k)===(b.d||b.k);
const qKeys=it=>it.type==='book'?(idx().all.get(it.d)||[]).slice().sort(col):(lib.files[it.k]?[it.k]:[]);
function qAdd(item,next){
 queueUp=queueUp.filter(x=>!qSame(x,item));
 if(next)queueUp.unshift(item);else queueUp.push(item);
 saveQ();toast(t(next?'queuedNext':'queued'));updateModes();if(tab==='pl'&&pl==='queue')renderLib();
}
function startItem(it){

 const k=it.type==='book'?bookResume(keys):keys[0];

}
function popUpNext(){

}

async function id3(f){
 const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
 if(String.fromCharCode(h[0],h[1],h[2])!=='ID3')return null;
 const ver=h[3],sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);
 const b=new Uint8Array(await f.slice(10,10+Math.min(sz,8e6)).arrayBuffer()),dv=new DataView(b.buffer);
 const out=[];let img=null;
 const str=(s,e,enc)=>new TextDecoder(enc==1?'utf-16':enc==2?'utf-16be':enc==3?'utf-8':'iso-8859-1').decode(b.subarray(s,e)).replace(/\0/g,'');
 const fs=o=>ver==4?((b[o]&127)<<21)|((b[o+1]&127)<<14)|((b[o+2]&127)<<7)|(b[o+3]&127):dv.getUint32(o);
 const frames=(o,end,cb)=>{while(o+10<=end){const id=String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;const s=fs(o+4);cb(id,o+10,o+10+s);o+=10+s}};
 frames(0,b.length,(id,s,e)=>{
  if(id==='CHAP'){
   let i=s;while(b[i])i++;const st=dv.getUint32(i+1);let title='';
   frames(i+17,e,(sid,ss,se)=>{if(sid==='TIT2')title=str(ss+1,se,b[ss])});
   out.push({t:st/1000,n:title||'Chapter '+(out.length+1)});
  }else if(id==='APIC'&&!img){
   const enc=b[s];let i=s+1;while(b[i])i++;i+=2;
   if(enc==1||enc==2){while(!(b[i]===0&&b[i+1]===0)&&i<e)i+=2;i+=2}else{while(b[i]&&i<e)i++;i++}
   if(i<e)img=new Blob([b.slice(i,e)]);
  }
 });
 return{ch:out.sort((x,y)=>x.t-y.t),img};
}
async function mp4(f,box){
 let o=0;
 while(o<f.size){
  const h=new DataView(await f.slice(o,o+16).arrayBuffer());let s=h.getUint32(0);
  const ty=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
  if(s===1)s=Number(h.getBigUint64(8));if(!s)s=f.size-o;if(s<8)break;
  if(ty==='moov'&&s<16e6){
   const b=new Uint8Array(await f.slice(o,o+s).arrayBuffer()),dv=new DataView(b.buffer);
   for(let j=0;j<b.length-24;j++)if(b[j]===99&&b[j+1]===111&&b[j+2]===118&&b[j+3]===114){const ds=dv.getUint32(j+4);if(ds>24&&j+4+ds<=b.length){if(box)box.img=new Blob([b.slice(j+20,j+4+ds)])};break}
   for(let i=0;i<b.length-16;i++)if(b[i]===99&&b[i+1]===104&&b[i+2]===112&&b[i+3]===108){
    let p=i+12;const n=b[p++],out=[];
    for(let j=0;j<n;j++){const st=Number(dv.getBigUint64(p));p+=8;const l=b[p++];out.push({t:st/1e7,n:new TextDecoder().decode(b.subarray(p,p+l))});p+=l}
    return out;
   }
   return[];
  }
  o+=s;
 }
 return[];
}

async function loadCh(f,k){
 chapters=[];lastCi=-2;updateTools();
 let img=null;
 try{
  if(/\.(m4b|m4a|mp4|aac)$/i.test(f.name)){const bx={};chapters=await mp4(f,bx);img=bx.img||null}
  else{const r=await id3(f);if(r){chapters=r.ch;img=r.img}}
 }catch{}

 if(!img){try{img=await coverFile(k)}catch{}}
 if(img&&key===k){lastCol=null;const d=await toData(img),col2=lastCol;if(d&&key===k)setCover(d,col2);const tk=thumbKey(k);if(d&&!thumbs[tk]){const th=await toData(img,160,.78);if(th)putThumb(tk,th)}}

}
/* local cover.jpg / folder.jpg fallback (same folder, then parent) */
async function coverFile(k){
 const F=lib.files[k];if(!F)return null;
 let dk=k.slice(0,k.lastIndexOf('/'));
 for(let up=0;up<2;up++){
  if(covers[dk]){const cv=covers[dk];if(cv.native){try{return await(await fetch(await nUrl(cv.root,cv.rel))).blob()}catch{}}else return cv}
  if(rootH[F.r]&&live.has(F.r)){
   try{
    let d=rootH[F.r];const p=dk.split('/').slice(1);
    for(const s of p)d=await d.getDirectoryHandle(s);
    let n=0;for await(const [nm2,h] of d.entries()){if(h.kind==='file'&&COV.test(nm2))return await h.getFile();if(++n>3000)break}
   }catch{}
  }
  if(!dk.includes('/'))break;dk=dk.slice(0,dk.lastIndexOf('/'));
 }
 return null;
}
/* downscale to a small JPEG data URL: low memory, reliable lock-screen artwork */
async function toData(blob,max=512,qual=.85){
 try{
  const bmp=await createImageBitmap(blob),s=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(max>=512){
   try{const c2=document.createElement('canvas');c2.width=c2.height=8;const g=c2.getContext('2d');g.drawImage(bmp,0,0,8,8);const d=g.getImageData(0,0,8,8).data;let r=0,gg=0,bb=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];bb+=d[i+2];n++}lastCol=[r/n|0,gg/n|0,bb/n|0]}catch{lastCol=null}
  }
  if(bmp.close)bmp.close();
  return c.toDataURL('image/jpeg',qual);
 }catch{return null}
}

function setCover(u,col){cover=u;$('#cover').src=u;$('#mCov').src=u;['#cover','#mCov'].forEach(sel=>{const e=$(sel);e.classList.remove('fx');void e.offsetWidth;e.classList.add('fx')});document.documentElement.style.setProperty('--cv',col?`rgba(${col[0]},${col[1]},${col[2]},.55)`:'rgba(90,100,170,.45)');setMeta()}
function setMeta(){
 if(!key||!('mediaSession'in navigator)||!lib.files[key])return;
 try{navigator.mediaSession.metadata=new MediaMetadata({title:nm(key),artist:(lastCi>=0&&chapters[lastCi]?chapters[lastCi].n+' · ':'')+folderName(key),album:rootName(lib.files[key].r),artwork:[96,128,192,256,384,512].map(z=>({src:cover||art,sizes:z+'x'+z}))})}catch{}
}
/* The OS draws the media notification; the page controls which actions it offers. */
function applyMediaActions(){
 if(!('mediaSession'in navigator))return;
 const ms=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};
 ms('play',()=>au.play());ms('pause',()=>au.pause());ms('stop',closePlayback);
 ms('seekbackward',d=>skip(-((d&&d.seekOffset)||cfg.back)));ms('seekforward',d=>skip((d&&d.seekOffset)||cfg.fwd));
 ms('seekto',d=>{au.currentTime=d.seekTime});
 window.__notifMode=cfg.notif;
 if(cfg.notif!=='seek'){ms('previoustrack',prevFile);ms('nexttrack',next)}else{ms('previoustrack',null);ms('nexttrack',null)}
}
applyMediaActions();
