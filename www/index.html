<style>

function idx(){

async function ingest(id,items,merge){
 if(!lib.roots.find(r=>r.id===id))lib.roots.push({id,name:id});

 try{
  if(!merge)for(const k in lib.files)if(lib.files[k].r===id){old[k]=lib.files[k];delete lib.files[k];delete fobjs[k]}
  for(let i=0;i<total;i++){
   const it=items[i],k=id+'/'+it.rel,o=old[k]||lib.files[k]||{};
   lib.files[k]={n:it.rel.slice(it.rel.lastIndexOf('/')+1),r:id,p:it.rel,s:it.f?it.f.size:o.s,m:it.f?it.f.lastModified:o.m};
   if(it.f)fobjs[k]=it.f;
   if(i%400===399){busy(t('indexing',i+1,total));await idle()}
  }

}
async function walk(dir,pre,out,st){
 for await(const [n,h] of dir.entries()){
  if(st.abort||st.over)return;
  if(n[0]==='.')continue;
  if(h.kind==='directory'){try{await walk(h,pre+n+'/',out,st)}catch{st.skipped++}}
  else if(isAud(n)){out.push(pre+n);if(out.length>=MAXF){st.over=true;return}}
  if(++st.c%100===0){busy(t('scanning',out.length));await idle()}
 }
}

 $('#shT').textContent=t('folderFiles')+' · '+(i+1)+'/'+sibs.length;
 const a=mk('div',null,'add'),bp=mk('button'),bn=mk('button');
 bp.innerHTML=ico('prev')+'<span>'+t('prevFile')+'</span>';bn.innerHTML='<span>'+t('nextFile')+'</span>'+ico('next');
 bp.style.flex=bn.style.flex='1';bp.disabled=i<=0;bn.disabled=i>=sibs.length-1;
 bp.onclick=()=>{closeSheet();stepFolder(-1)};bn.onclick=()=>{closeSheet();stepFolder(1)};
 a.append(bp,bn);b.append(a);
 const L=mk('div');
 sibs.slice(Math.max(0,i-150),i+250).forEach(k=>{
  const r=fileRow(k,sibs,false);if(k===key)r.classList.add('cur');
  r.onclick=()=>{closeSheet();if(k!==key)play(k,sibs,undefined,true,false)};L.append(r);
 });
 b.append(L);setTimeout(()=>{const c=L.querySelector('.cur');if(c)c.scrollIntoView({block:'center'})},320);
};
function openSheet(n){
 if((n==='marks'||n==='chap'||n==='files')&&!key)return toast(t('pickFile'));
 sheetName=n;$('#shT').textContent=t({speed:'speed',sleep:'sleep',marks:'bm',chap:'chap',files:'folderFiles'}[n]);
 const b=$('#shB');b.innerHTML='';SH[n](b);const s=$('#sheet');s.hidden=false;
 requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('open')));
}
function closeSheet(){const s=$('#sheet');s.classList.remove('open');sheetName=null;setTimeout(()=>{if(!sheetName)s.hidden=true},300)}
$('#bd').onclick=$('#shX').onclick=closeSheet;
$('#bSpeed').onclick=()=>openSheet('speed');$('#bSleep').onclick=()=>openSheet('sleep');$('#bMark').onclick=()=>openSheet('marks');$('#bChap').onclick=()=>openSheet('chap');
function updateTools(){
 $('#bSpeed small').textContent=cfg.rate.toFixed(2).replace(/0$/,'')+'×';
 $('#bSleep small').textContent=sleep?(sleep.track?t('endTrack'):fmt((sleep.end-Date.now())/1000)):t('off');
 $('#bMark small').textContent=marks.filter(m=>m.k===key).length||'—';
 $('#bChap small').textContent=chapters.length||'—';
}


/* ---------- playback & player UI ---------- */
function save(){if(noFlush)return;if(key&&isFinite(au.duration)&&au.duration>0){prog[key]=[au.currentTime,au.duration,Date.now()];saveProg();SV('ab_last',key)}}
setInterval(()=>{if(!au.paused){save();if((tab==='pl'||tab==='home')&&!playerOpen)renderLib()}},5000);
addEventListener('pagehide',()=>{save();flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();flush()}else renderLib()});
function openPlayer(){if(playerOpen)return;playerOpen=true;$('#player').classList.add('open');history.pushState({t:tab,c:cur,p:1},'');updateMini()}
function closePlayerUI(){playerOpen=false;$('#player').classList.remove('open');updateMini()}
function updateMini(){$('#mini').hidden=!key||playerOpen}
$('#pClose').onclick=()=>{if(history.state&&history.state.p)history.back();else closePlayerUI()};
async function play(k,q2,startAt,auto=true,open=true){
 const rid=lib.files[k]&&lib.files[k].r;if(rid&&auto)await ensureRoot(rid);
 const f=await getFile(k);
 if(!f){if(auto)toast(t('notLinked'));return}
 save();key=k;queue=q2&&q2.includes(k)?q2:siblings(k);qi=queue.indexOf(k);last=k;SV('ab_last',k);
 const p=prog[k]||[0,0],pos=startAt!=null?startAt:(isDone(p[0],p[1])?0:p[0]);
 if(objUrl)URL.revokeObjectURL(objUrl);
 objUrl=URL.createObjectURL(f);au.volume=1;au.src=objUrl;au.defaultPlaybackRate=cfg.rate;
 au.onloadedmetadata=()=>{prog[k]=[pos,au.duration,Date.now()];au.currentTime=Math.min(pos,Math.max(0,au.duration-1));au.playbackRate=cfg.rate;if(auto)au.play().catch(()=>{});tick()};
 $('#ttl').textContent=nm(k);$('#sub').textContent=folderName(k);$('#mTtl').textContent=nm(k);$('#mSub').textContent=folderName(k);
 setCover(art);loadCh(f,k);renderLib();updateTools();updateMini();
 if(auto&&open&&!playerOpen)openPlayer();
}
function jump(m){if(key===m.k){au.currentTime=m.t;au.play()}else play(m.k,siblings(m.k),m.t,true,false);openPlayer()}
const skip=n=>{au.currentTime=Math.max(0,Math.min(au.duration||0,au.currentTime+n))};
function next(){if(qi<queue.length-1)play(queue[qi+1],queue,undefined,true,false)}
function prev(){if(au.currentTime>3||qi<1)au.currentTime=0;else play(queue[qi-1],queue,undefined,true,false)}
function stepFolder(d){const sibs=siblings(key),i=sibs.indexOf(key),k=sibs[i+d];if(k)play(k,sibs,undefined,true,false)}
/* stop playback, release the audio element and dismiss the OS media notification */
function closePlayback(){
 save();flush();au.pause();
 if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
 au.removeAttribute('src');au.load();
 key=null;last=null;SV('ab_last',null);chapters=[];queue=[];qi=-1;setSleep('off');
 if('mediaSession'in navigator){try{navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none'}catch{}}
 $('#ttl').textContent=t('nothing');$('#sub').textContent=t('pickFile');$('#chName').textContent='';
 setCover(art);
 if(playerOpen){if(history.state&&history.state.p)history.back();else closePlayerUI()}
 updateMini();updateTools();tick();renderLib();
}
const toggle=()=>{if(!key)return toast(t('pickFile'));au.paused?au.play():au.pause()};
au.onended=()=>{
 if(key&&au.duration)prog[key]=[au.duration,au.duration,Date.now()];saveProg();
 if(sleep&&sleep.track){au.volume=1;sleep=null;tickSleep();renderLib();return}
 next();
};
au.onplay=au.onpause=()=>{
 const p=!au.paused;$('#bPlay').innerHTML=$('#mPlay').innerHTML=ico(p?'pause':'play');
 if('mediaSession'in navigator)navigator.mediaSession.playbackState=p?'playing':'paused';
 if(!p)save();renderLib();
};
au.onerror=()=>toast(t('cantPlay'));
function tick(){
 const d=au.duration||0,c=au.currentTime||0;
 if(!drag){$('#seek').max=d;$('#seek').value=c;$('#seek').style.setProperty('--p',(d?c/d*100:0)+'%');$('#tCur').textContent=fmt(c)}
 $('#tTot').textContent=fmt(d);$('#tRem').textContent=d?`${Math.round(c/d*100)}% · ${t('left',fmt(d-c))}`:'';
 if(!mdrag){const ms=$('#mSeek');ms.max=d;ms.value=c;ms.style.setProperty('--p',(d?c/d*100:0)+'%');$('#mCur').textContent=fmt(c)}
 $('#mTot').textContent=fmt(d);
 let ci=-1;chapters.forEach((ch,i)=>{if(ch.t<=c+.3)ci=i});
 if(ci!==lastCi){lastCi=ci;$('#chName').textContent=ci>=0?chapters[ci].n:''}
 if('mediaSession'in navigator&&d&&isFinite(d))try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(c,d),playbackRate:au.playbackRate||1})}catch{}
}
au.ontimeupdate=tick;
$('#seek').oninput=e=>{drag=true;const v=+e.target.value,d=au.duration||1;e.target.style.setProperty('--p',(v/d*100)+'%');$('#tCur').textContent=fmt(v)};
$('#seek').onchange=e=>{au.currentTime=+e.target.value;drag=false};
let mdrag=false,mLast=0;
$('#mSeek').oninput=e=>{mdrag=true;const v=+e.target.value,d=au.duration||1;e.target.style.setProperty('--p',(v/d*100)+'%');$('#mCur').textContent=fmt(v);const n=Date.now();if(n-mLast>120){mLast=n;au.currentTime=v}};
$('#mSeek').onchange=e=>{au.currentTime=+e.target.value;mdrag=false};
$('#bPlay').onclick=$('#mPlay').onclick=toggle;$('#bNext').onclick=next;$('#bPrev').onclick=prev;
$('#bBack').onclick=$('#mBack').onclick=()=>skip(-cfg.back);$('#bFwd').onclick=$('#mFwd').onclick=()=>skip(cfg.fwd);
$('#mInfo').onclick=$('#mOpen').onclick=openPlayer;

au.preservesPitch=true;
function setRate(v){
 cfg.rate=Math.round(Math.min(3,Math.max(.5,v))*100)/100;au.playbackRate=au.defaultPlaybackRate=cfg.rate;saveCfg();
 const s=$('#rate');if(s){s.value=cfg.rate;s.style.setProperty('--p',((cfg.rate-.5)/2.5*100)+'%')}const g=$('#rateBig');if(g)g.textContent=cfg.rate.toFixed(2)+'×';
 document.querySelectorAll('#shB [data-r]').forEach(b=>b.classList.toggle('on',+b.dataset.r===cfg.rate));updateTools();
}
function setSleep(v){
 clearInterval(sleepT);au.volume=1;sleep=null;
 if(v==='track')sleep={track:1};else if(v!=='off')sleep={end:Date.now()+v*60000};
 if(sleep){sleepT=setInterval(tickSleep,500);toast(t('sleepSet'))}
 tickSleep();
}
function tickSleep(){
 const l=$('#sleepLbl'),f=cfg.fade;
 if(!sleep){if(l)l.textContent=t('off');clearInterval(sleepT);updateTools();return}
 if(sleep.track){if(l)l.textContent=t('endTrack');const r=au.duration-au.currentTime;if(f&&r<10&&!au.paused)au.volume=Math.max(.03,r/10);updateTools();return}
 const r=(sleep.end-Date.now())/1000;
 if(r<=0){au.pause();au.volume=1;sleep=null;if(l)l.textContent=t('off');clearInterval(sleepT);updateTools();return}
 if(l)l.textContent=fmt(r);if(f&&r<15)au.volume=Math.max(.03,r/15);updateTools();
}
function addMark(note){
 if(!key)return toast(t('pickFile'));
 marks.push({id:Date.now(),k:key,t:au.currentTime,note:(note||'').trim(),at:Date.now()});
 SV('ab_bm',marks);renderMarks();updateTools();toast(t('markAdded',fmt(au.currentTime)));
}

async function id3(f){
 const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
 if(String.fromCharCode(h[0],h[1],h[2])!=='ID3')return null;
 const ver=h[3],sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);
 const b=new Uint8Array(await f.slice(10,10+Math.min(sz,8e6)).arrayBuffer()),dv=new DataView(b.buffer);
 const out=[];let img=null;
 const str=(s,e,enc)=>new TextDecoder(enc==1?'utf-16':enc==2?'utf-16be':enc==3?'utf-8':'iso-8859-1').decode(b.subarray(s,e)).replace(/\0/g,'');
 const fs=o=>ver==4?((b[o]&127)<<21)|((b[o+1]&127)<<14)|((b[o+2]&127)<<7)|(b[o+3]&127):dv.getUint32(o);
 const frames=(o,end,cb)=>{while(o+10<=end){const id=String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;const s=fs(o+4);cb(id,o+10,o+10+s);o+=10+s}};
 frames(0,b.length,(id,s,e)=>{
  if(id==='CHAP'){
   let i=s;while(b[i])i++;const st=dv.getUint32(i+1);let title='';
   frames(i+17,e,(sid,ss,se)=>{if(sid==='TIT2')title=str(ss+1,se,b[ss])});
   out.push({t:st/1000,n:title||'Chapter '+(out.length+1)});
  }else if(id==='APIC'&&!img){
   const enc=b[s];let i=s+1;while(b[i])i++;i+=2;
   if(enc==1||enc==2){while(!(b[i]===0&&b[i+1]===0)&&i<e)i+=2;i+=2}else{while(b[i]&&i<e)i++;i++}
   if(i<e)img=new Blob([b.slice(i,e)]);
  }
 });
 return{ch:out.sort((x,y)=>x.t-y.t),img};
}
async function mp4(f,box){
 let o=0;
 while(o<f.size){
  const h=new DataView(await f.slice(o,o+16).arrayBuffer());let s=h.getUint32(0);
  const ty=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
  if(s===1)s=Number(h.getBigUint64(8));if(!s)s=f.size-o;if(s<8)break;
  if(ty==='moov'&&s<16e6){
   const b=new Uint8Array(await f.slice(o,o+s).arrayBuffer()),dv=new DataView(b.buffer);
   for(let j=0;j<b.length-24;j++)if(b[j]===99&&b[j+1]===111&&b[j+2]===118&&b[j+3]===114){const ds=dv.getUint32(j+4);if(ds>24&&j+4+ds<=b.length){if(box)box.img=new Blob([b.slice(j+20,j+4+ds)])};break}
   for(let i=0;i<b.length-16;i++)if(b[i]===99&&b[i+1]===104&&b[i+2]===112&&b[i+3]===108){
    let p=i+12;const n=b[p++],out=[];
    for(let j=0;j<n;j++){const st=Number(dv.getBigUint64(p));p+=8;const l=b[p++];out.push({t:st/1e7,n:new TextDecoder().decode(b.subarray(p,p+l))});p+=l}
    return out;
   }
   return[];
  }
  o+=s;
 }
 return[];
}

async function loadCh(f,k){
 chapters=[];lastCi=-2;updateTools();
 let img=null;
 try{
  if(/\.(m4b|m4a|mp4|aac)$/i.test(f.name)){const bx={};chapters=await mp4(f,bx);img=bx.img||null}
  else{const r=await id3(f);if(r){chapters=r.ch;img=r.img}}
 }catch{}
 if(key!==k)return;
 if(!img){try{img=await coverFile(k)}catch{}}
 if(img&&key===k){lastCol=null;const d=await toData(img),col2=lastCol;if(d&&key===k)setCover(d,col2);const tk=thumbKey(k);if(d&&!thumbs[tk]){const th=await toData(img,160,.78);if(th)putThumb(tk,th)}}
 if(key===k){updateTools();tick()}
}
/* local cover.jpg / folder.jpg fallback (same folder, then parent) */
async function coverFile(k){
 const F=lib.files[k];if(!F)return null;
 let dk=k.slice(0,k.lastIndexOf('/'));
 for(let up=0;up<2;up++){
  if(covers[dk])return covers[dk];
  if(rootH[F.r]&&live.has(F.r)){
   try{
    let d=rootH[F.r];const p=dk.split('/').slice(1);
    for(const s of p)d=await d.getDirectoryHandle(s);
    let n=0;for await(const [nm2,h] of d.entries()){if(h.kind==='file'&&COV.test(nm2))return await h.getFile();if(++n>3000)break}
   }catch{}
  }
  if(!dk.includes('/'))break;dk=dk.slice(0,dk.lastIndexOf('/'));
 }
 return null;
}
/* downscale to a small JPEG data URL: low memory, reliable lock-screen artwork */
async function toData(blob,max=512,qual=.85){
 try{
  const bmp=await createImageBitmap(blob),s=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(max>=512){
   try{const c2=document.createElement('canvas');c2.width=c2.height=8;const g=c2.getContext('2d');g.drawImage(bmp,0,0,8,8);const d=g.getImageData(0,0,8,8).data;let r=0,gg=0,bb=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];bb+=d[i+2];n++}lastCol=[r/n|0,gg/n|0,bb/n|0]}catch{lastCol=null}
  }
  if(bmp.close)bmp.close();
  return c.toDataURL('image/jpeg',qual);
 }catch{return null}
}
/* ---------- lock screen / notification ---------- */
function setCover(u,col){cover=u;$('#cover').src=u;$('#mCov').src=u;['#cover','#mCov'].forEach(sel=>{const e=$(sel);e.classList.remove('fx');void e.offsetWidth;e.classList.add('fx')});document.documentElement.style.setProperty('--cv',col?`rgba(${col[0]},${col[1]},${col[2]},.55)`:'rgba(90,100,170,.45)');setMeta()}
function setMeta(){
 if(!key||!('mediaSession'in navigator)||!lib.files[key])return;
 try{navigator.mediaSession.metadata=new MediaMetadata({title:nm(key),artist:folderName(key),album:rootName(lib.files[key].r),artwork:[96,128,192,256,384,512].map(z=>({src:cover||art,sizes:z+'x'+z}))})}catch{}
}
/* The OS draws the media notification; the page controls which actions it offers. */
function applyMediaActions(){
 if(!('mediaSession'in navigator))return;
 const ms=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};
 ms('play',()=>au.play());ms('pause',()=>au.pause());ms('stop',closePlayback);
 ms('seekbackward',d=>skip(-((d&&d.seekOffset)||cfg.back)));ms('seekforward',d=>skip((d&&d.seekOffset)||cfg.fwd));
 ms('seekto',d=>{au.currentTime=d.seekTime});
 if(cfg.notif==='tracks'){ms('previoustrack',prev);ms('nexttrack',next)}else{ms('previoustrack',null);ms('nexttrack',null)}
}
applyMediaActions();

/* ---------- start ---------- */
try{
 $('#addDir').onclick=addDir;$('#addFiles').onclick=()=>$('#fFiles').click();$('#recon').onclick=()=>reconnectAll();
 $('#q').oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>{q=$('#q').value;renderLib()},220)};
 document.addEventListener('click',()=>{if(autoDone)return;autoDone=true;if(lib.roots.some(r=>r.fs&&rootH[r.id]&&!live.has(r.id)))reconnectAll()},{capture:true});
 const ai=mk('link');ai.rel='apple-touch-icon';ai.href=art;document.head.append(ai);
 $('#cover').src=$('#mCov').src=art;
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 history.replaceState({t:'home',c:[],p:0},'');
 initUI();applyTheme();applyLang();setRate(cfg.rate);
 if(!window.__native&&'serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
 addEventListener('error',()=>busyOff());
 addEventListener('unhandledrejection',e=>{busyOff();if(!window._oe||Date.now()-window._oe>5000){window._oe=Date.now();toast(t('oops'))}});
 window.__ready=true;
 boot().then(()=>{if(last&&lib.files[last])play(last,siblings(last),undefined,false);durQueue();bgScan().catch(()=>{})}).catch(e=>{booted=true;renderLib();console.error(e)});
}catch(e){window.__fatal(e)}
